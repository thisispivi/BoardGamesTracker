allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  sharp: true
  unrs-resolver: true
# ExcelJS currently pins a legacy glob stack whose only compatible fix has not
# been released upstream. This narrowly scoped exception keeps every other
# moderate-or-higher vulnerability blocking CI.
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
minimumReleaseAgeExclude:
  # Dependabot updates reviewed in PR #5; pinning exact versions keeps the
  # release-age exception limited to this vetted dependency set.
  - "@next/env@16.2.12"
  - "@next/swc-darwin-arm64@16.2.12"
  - "@next/swc-darwin-x64@16.2.12"
  - "@next/swc-linux-arm64-gnu@16.2.12"
  - "@next/swc-linux-arm64-musl@16.2.12"
  - "@next/swc-linux-x64-gnu@16.2.12"
  - "@next/swc-linux-x64-musl@16.2.12"
  - "@next/swc-win32-arm64-msvc@16.2.12"
  - "@next/swc-win32-x64-msvc@16.2.12"
  - lucide-react@1.27.0
  - next@16.2.12
  - lint-staged@17.1.0
overrides:
  exceljs>uuid: 11.1.1
  esbuild: 0.28.1
  postcss: 8.5.19
  sharp: 0.35.0
packages:
  - .
