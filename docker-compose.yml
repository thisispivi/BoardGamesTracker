services:
  database:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-board_games_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-board_games_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - board_games_tracker_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-board_games_tracker} -d ${POSTGRES_DB:-board_games_tracker}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - private

  searxng:
    image: searxng/searxng:2026.8.11-e8e710e42
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - private

  app:
    build:
      context: .
      args:
        APP_URL: ${APP_URL:?Set APP_URL in .env}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
        NEXT_PUBLIC_SENTRY_RELEASE: ${NEXT_PUBLIC_SENTRY_RELEASE:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
        SENTRY_URL: ${SENTRY_URL:-}
      secrets:
        - sentry_auth_token
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      searxng:
        condition: service_started
    environment:
      # Docker sets HOSTNAME to the container ID, which the Next.js standalone
      # server would otherwise bind to instead of all interfaces, leaving the
      # HEALTHCHECK's loopback probe unable to connect.
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER:-board_games_tracker}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-board_games_tracker}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${APP_URL:?Set APP_URL in .env}
      NEXT_PUBLIC_APP_URL: ${APP_URL:?Set APP_URL in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ALLOW_SIGN_UP: ${ALLOW_SIGN_UP:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SEARXNG_URL: http://searxng:8080
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
      NEXT_PUBLIC_SENTRY_RELEASE: ${NEXT_PUBLIC_SENTRY_RELEASE:-}
    ports:
      - "${APP_PORT:-12500}:12500"
    networks:
      - private

volumes:
  board_games_tracker_data:
    name: ${POSTGRES_VOLUME_NAME:-board_games_tracker_data}

networks:
  private:
    driver: bridge

secrets:
  sentry_auth_token:
    file: ${SENTRY_AUTH_TOKEN_FILE:-.sentry-auth-token.disabled}
