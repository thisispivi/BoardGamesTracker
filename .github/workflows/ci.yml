name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: board-games-tracker
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      BETTER_AUTH_SECRET: build-only-secret-not-used-at-runtime-000000000
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SEARXNG_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.24.0
          runtime: node@24.21.0
          cache: true
          cache-dependency-path: board-games-tracker/pnpm-lock.yaml
          package-json-file: board-games-tracker/package.json
          install: false
      - name: Install dependencies
        if: github.actor != 'dependabot[bot]'
        run: pnpm install --frozen-lockfile
      - name: Install Dependabot dependencies
        if: github.actor == 'dependabot[bot]'
        run: pnpm install --frozen-lockfile --trust-lockfile
      - name: Audit dependencies
        run: |
          for attempt in 1 2 3; do
            if timeout 90s pnpm audit --audit-level=moderate; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          exit 1
      - run: pnpm check
      - name: Enforce the coverage floor
        run: pnpm test:coverage
      - run: pnpm build
