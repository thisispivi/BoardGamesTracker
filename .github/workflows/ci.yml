name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: board-games-tracker
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      BETTER_AUTH_SECRET: build-only-secret-not-used-at-runtime-000000000
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SEARXNG_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 11.24.0
          runtime: node@24.21.0
          cache: true
          cache-dependency-path: board-games-tracker/pnpm-lock.yaml
          package-json-file: board-games-tracker/package.json
          install: false
      - name: Install dependencies
        if: github.actor != 'dependabot[bot]'
        run: pnpm install --frozen-lockfile
      - name: Install Dependabot dependencies
        if: github.actor == 'dependabot[bot]'
        run: pnpm install --frozen-lockfile --trust-lockfile
      - name: Audit dependencies
        run: |
          for attempt in 1 2 3; do
            if timeout 90s pnpm audit --audit-level=moderate; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          exit 1
      - run: pnpm check
      - name: Enforce the coverage floor
        run: pnpm test:coverage
      - run: pnpm build
      - name: Verify the public static demo
        run: pnpm demo:build

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: board-games-tracker
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      BETTER_AUTH_SECRET: build-only-secret-not-used-at-runtime-000000000
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SEARXNG_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read the merged release version
        id: version
        run: |
          latest=$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          current=$(node -p 'require("./package.json").version')
          if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "$current"; then
            echo 'Release package versions must use stable semantic versioning.' >&2
            exit 1
          fi
          if [ -n "$latest" ] && git merge-base --is-ancestor HEAD "$latest"; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$latest" ]; then
            messages=$(git log "$latest..HEAD" --format=%B)
            bump=patch
            if grep -Eq '(^[a-z]+(\([^)]+\))?!:|^BREAKING CHANGE:)' <<< "$messages"; then
              bump=major
            elif grep -Eq '^feat(\([^)]+\))?:' <<< "$messages"; then
              bump=minor
            fi
            if [ "$current" = "${latest#v}" ]; then
              echo "::notice title=Release version needs a pull request::Merge a $bump package version bump through a pull request to publish the next release."
              echo 'skip=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$(printf '%s\n' "$current" "${latest#v}" | sort -V | head -n 1)" != "${latest#v}" ]; then
              echo 'Package version must be newer than the latest release tag.' >&2
              exit 1
            fi
          fi
          echo "tag=v$current" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create '${{ steps.version.outputs.tag }}' --target "$(git rev-parse HEAD)" --title '${{ steps.version.outputs.tag }}' --generate-notes

  deploy-demo:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: board-games-tracker
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 11.24.0
          runtime: node@24.21.0
          cache: true
          cache-dependency-path: board-games-tracker/pnpm-lock.yaml
          package-json-file: board-games-tracker/package.json
          install: false
      - uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - name: Build the fictional account showcase
        run: pnpm demo:build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: board-games-tracker/demo/out
      - name: Deploy the demo
        id: deployment
        uses: actions/deploy-pages@v4
